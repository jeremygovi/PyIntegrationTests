apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: fixture
    pyintegrationtests.io/run: {{ .Values.runId | quote }}
  annotations:
    example.com/purpose: integration-test
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        pyintegrationtests.io/run: {{ .Values.runId | quote }}
    spec:
      containers:
        - name: web
          image: {{ .Values.image | quote }}
          ports:
            - {name: http, containerPort: 80}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          livenessProbe:
            httpGet: {path: /, port: http}
          readinessProbe:
            httpGet: {path: /, port: http}
