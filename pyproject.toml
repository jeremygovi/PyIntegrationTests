[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pyintegrationtests"
version = "0.1.0a1"
description = "Declarative infrastructure integration tests powered by pytest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pytest>=8.3,<10", "pydantic>=2.10,<3", "PyYAML>=6.0.2,<7",
  "jsonpath-ng>=1.7,<2", "httpx>=0.28,<0.29", "tenacity>=9,<10",
  "python-dotenv>=1.0,<2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
kubernetes = ["kubernetes>=32,<35"]
cloudflare = ["cloudflare>=4,<5"]
dns = ["dnspython[doh]>=2.7,<3"]
auth = ["PyJWT[crypto]>=2.10,<3"]
all = ["pyintegrationtests[aws,kubernetes,cloudflare,dns,auth]"]

[project.scripts]
pyintegrationtests = "pyintegrationtests.cli:main"

[project.entry-points.pytest11]
pyintegrationtests = "pyintegrationtests.pytest_plugin"

[project.urls]
Repository = "https://github.com/jeremygovi/PyIntegrationTests"
Issues = "https://github.com/jeremygovi/PyIntegrationTests/issues"

[dependency-groups]
dev = [
  "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2",
  "pyright[nodejs]>=1.1.400,<2", "types-PyYAML>=6,<7", "types-jsonschema>=4,<5",
  "jsonschema>=4.23,<5", "build>=1.2,<2", "twine>=6,<7", "hatchling>=1.27,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyintegrationtests"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract"]
addopts = "-ra --strict-markers --strict-config"
markers = ["live: requires explicitly configured real infrastructure"]
filterwarnings = ["error", "ignore::DeprecationWarning:kubernetes.*"]

[tool.coverage.run]
source = ["pyintegrationtests"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yaml.*", "jsonpath_ng.*", "boto3.*", "botocore.*", "kubernetes.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cloudflare.*"]
follow_imports = "skip"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
