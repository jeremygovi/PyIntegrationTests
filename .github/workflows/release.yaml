name: Build release artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify tag version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker build --target tooling -t pyintegrationtests-tooling .
          docker run --rm -e RELEASE_TAG -v "$PWD:/app" pyintegrationtests-tooling python scripts/check_release.py
      - name: Verify and package in Docker
        run: make all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyintegrationtests-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
